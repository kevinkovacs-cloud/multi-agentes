# Bloque E · «parada técnica» — parámetros PRE-REGISTRADOS, versión 2 (08/10/2026).
# Se commitea ANTES de correr P1 v2, P2b v2 y E3. Es la única revisión (E2_RESPUESTA de Claude chat):
# si la v2 tampoco muestra transiciones, no se cambia nada más.
# La versión 1 (la del primer pre-registro, commit 2d847ad) queda congelada en configs/parada_tecnica_v1.yaml.
#
# Cambios respecto de v1 y su motivo (docs/parada_tecnica/E2_RESPUESTA_ClaudeChat_2026-10-08.md):
#   1. omega.gate_evolucion: «puntual» → «evidencia_de_sesgo». Ω niega la promoción solo si
#      LCB_{δ/L}(|Δ_DP|) > τ_b sobre TODAS las decisiones del agente en la capa (L = cierres posibles de
#      la capa, Bonferroni). Motivo: con ventanas de 20, el gate puntual era ruido de muestreo; se usa el
#      mismo primitivo que la regla de bloqueo publicada (cota de confianza, no estimación puntual).
#   2. planificador.utilidad_teoria: «u_tarea» → «accion». U(Si, A) = (aciertos de A en la celda + 1) /
#      (K(Si, A) + 2), igual para todas las variantes (Si, A, ·); validez del plan: U ≥ 0,5. Motivo:
#      utilidad basada en la acción (Ierache 2010, §4.4.3.2, pp. 89–90; el planificador por ranking rinde
#      mejor con ella, p. 107) y recomendación 2(a) de la hoja; evita que un acierto aislado deje U = 1.
#   3. ciclo_de_vida.evaluacion: «por_intervalo» → «acumulada_en_la_capa». CE_a, CE_0 y teorías nuevas se
#      acumulan desde el inicio de la capa (p. 118: ciclos exitosos es un contador acumulado; Fig. 4.28).
#   4. compartir (nuevo, para E3): mismo criterio que el gate v2 y can_donate.
# Sin cambios: semilla, n, ciclos por capa, %RCE, %RTN, umbral de ciclo exitoso, ε de WIO, τ_b, δ.

version_preregistro: v2
semilla: 20261008                 # aprobado (E2_RESPUESTA §5)

ciclo_de_vida:
  n_intervalo: 20                 # P1: ciclos por intervalo; también la ventana de fair(W) informada
  ciclos_por_capa:
    BIO: 60                       # 3 cierres posibles (L = 3)
    TBO: 100                      # 5 cierres posibles (L = 5)
    WIO: 100                      # 5 cierres posibles (L = 5)
  rce: 25                         # P1: %RCE
  rtn: 20                         # P1: %RTN (solo si el agente recibió colaboración en la capa)
  umbral_ciclo_exitoso: 0.75      # p. 118. Ciclo exitoso = la acción del ciclo fue correcta (u del ciclo = 1), igual para el agente y el SAR neutro (E2_RESPUESTA §2)
  evaluacion: acumulada_en_la_capa   # v2, cambio 3
  fin_en_mature: true             # aprobado (E2_RESPUESTA §5)
  sin_promocion: detener          # P2

omega:
  gate_evolucion: evidencia_de_sesgo   # v2, cambio 1; la reputación r y el certificado se informan, no deciden
  tau_b: 0.075                    # umbral del Monitor (el mismo de la regla de bloqueo)
  delta: 0.05                     # nivel de la cota; Bonferroni δ/L por los cierres de la capa
  tau: 0.8                        # se sigue informando la reputación puntual frente a τ (no decide en v2)
  certificado_informado: true
  criterio: demographic_parity    # aprobado (E2_RESPUESTA §5)
  atributo: origin_group          # plano de auditoría (DE-4)

planificador:
  orden: fig_4_21                 # U desc, P desc, K asc (desempate: recencia desc, id asc)
  utilidad_teoria: accion         # v2, cambio 2: U(Si, A) con Laplace; rango [0, 1] (Ierache usa [−1, 1])
  validez_plan: u_mayor_o_igual_0_5   # v2, cambio 2 (reemplaza a u_tarea > 0)
  acciones_orden_fijo: [ADVANCE, REJECT]   # aprobado: exploración «azar» solo en BIO y TBO
  respaldo_similitud: false       # aprobado: apagado en P1; encendido solo en P2b (ii)
  delta_similitud: 0.7
  similitud: token-cosine

utilidad:
  alpha: 1.0
  alpha_comparacion: 0.5
  m_min_por_grupo: 5              # aprobado; a esta escala α = 0,5 no tiene efecto (se reporta)

entorno:
  ruido_wio_epsilon: 0.1          # aprobado

compartir:                        # E3 (punto 2a), pre-registrado en v2 antes de correr
  gate: evidencia_de_sesgo        # se rechaza al donante si LCB_δ(|Δ_DP|) > τ_b sobre TODAS sus decisiones (una evaluación por operación: sin Bonferroni)
  m0_historia_minima: 3           # A9 en ventanas (corrida original de E3; se conserva para el código heredado)
  # Pre-registro corto de E3 (08/10/2026, E3_RESPUESTA de Claude chat), commiteado antes de correr: A9 se mide
  # en DECISIONES. Motivo: con el gate v2 (LCB) la cantidad de decisiones ya entra en la cota; a A9 solo le
  # queda garantizar que haya decisiones de los dos grupos sobre las cuales calcularla. En el LLC se coopera
  # entre SARs recién nacidos (Ierache 2010, p. 124). Nada más cambia.
  a9: decisiones                  # «ventanas» (original) | «decisiones» (pre-registro corto de E3)
  a9_min_decisiones: 20           # al menos un intervalo de decisiones propias
  a9_ambos_grupos: true           # cada grupo del atributo protegido representado (sin los dos no hay LCB)
  equipos:                        # un Matcher por equipo; cada uno recorre su propio escenario con su semilla
    A: 20261008                   # el agente de P1 v2 (donante de la colaboración si gana Trained o Mature)
    B: 20261108                   # recorre BIO con su semilla hasta ganar Novice (receptor; par de la cooperación)
    C: 20261208                   # ídem (par de la cooperación con B)
  si_falta_un_estado: detener_y_avisar   # E2_RESPUESTA §4: sin fijar estados a mano

# Pre-registro E4 (08/10/2026): todos los roles con su ciclo de vida y la traza completa (punto 4).
# Se commitea ANTES de correr P4. Reglas del entorno de cada rol: instances/hr/entorno.py, reglas 7 a 10;
# tasas esperadas por (celda de Si, estrategia) en docs/parada_tecnica/E4_PREREGISTRO.md.
# Los parámetros del ciclo de vida (n, ciclos por capa, %RCE, %RTN, gate v2, U por acción, evaluación
# acumulada) son los de la v2, iguales para todos los roles.
equipo_e4:
  semilla_casos: 20261008          # el mismo flujo de casos que P1 v2 (escenarios BIO, TBO y WIO)
  semilla_documentos: 20261009     # plantilla y defecto del documento de cada caso (regla 7)
  semilla_destinatario: 20261010   # destinatario de la explicación de cada caso (regla 10)
  flujo: [BIO, TBO, WIO]           # escenarios del flujo de casos del equipo; casos por escenario = ciclos_por_capa
  ventana: 20                      # casos por ventana del equipo: un ciclo del Bias Auditor por ventana
  orquestacion: langgraph          # el DAG de cada ventana es un StateGraph (core/grafo.py)
  orden_dag: [parser, matcher, bias_auditor, orchestrator, explainer]
  capa_del_ciclo: la_del_rol       # cada rol transita SU capa (la de su estado ganado); el escenario solo fija los casos
  sin_promocion_en_el_equipo: sigue_sin_R7   # capa agotada sin promoción: el rol sigue actuando y aprendiendo (R1–R6), sin evaluar R7
  mature_en_el_equipo: sigue_sin_R7          # Mature es el estado final: sigue en servicio (R1–R6)
  alpha: 1.0                       # LLC puro en P4 (α = 0,5 se compara en E6)
  roles:
    parser:
      acciones_orden_fijo: [reglas_estrictas, diccionario_sinonimos]
      operador_bio: reglas_estrictas
    matcher:
      acciones_orden_fijo: [ADVANCE, REJECT]
      operador_bio: dos_o_mas_skills_clave
    bias_auditor:
      acciones_orden_fijo: [LIBERAR, DERIVAR]
      operador_bio: regla_certificada   # DE-6: la acción la decide la regla, no la teoría
    explainer:
      acciones_orden_fijo: [por_factores, contrafactica, regulatoria]
      operador_bio: por_factores
    orchestrator: sin_teorias          # DE-7
  casos_traza:                     # primer caso de la última ventana de cada escenario (número de caso, desde 1)
    BIO: 41
    TBO: 81
    WIO: 81

# Pre-registro E5 (08/10/2026): equipos DAG, un equipo maduro hace madurar a otro (punto 3).
# Se commitea ANTES de correr P3, junto con docs/parada_tecnica/E4_RESPUESTA_ClaudeChat_2026-10-08.md.
# Vale todo lo de equipo_e4 salvo lo que se cambia acá. Ningún cambio es de parámetros numéricos.
# Los resultados de E4 quedan como están (no se vuelve a correr P4).
equipo_e5:
  base: equipo_e4
  # decisión 1 (E4_RESPUESTA): el Bias Auditor no tiene estados ganados; rol supervisor de configuración
  # BIO fija, como el Orchestrator (DE-7). Conserva su base («teorías de sesgo») y las regiones 1 a 6; no
  # aplica la región 7. Motivo: su acción la fija la regla certificada (DE-6), que no aprende (§4.4.10).
  auditor_evoluciona: false
  # decisión 3: en WIO explora solo el rol cuya acción no puede cambiar la decisión sobre la persona.
  # El Explainer actúa después de la decisión; P3 («azar» solo en BIO y TBO) se mantiene para los demás.
  explora_en_wio: [explainer]
  # decisión 6: la Si del Explainer queda tipo · destinatario (6 celdas). La regla 10 del entorno no cambia:
  # los requisitos siguen dependiendo de los motivos del caso, que el Explainer ya no percibe.
  si_explainer: [tipo, destinatario]
  equipos:                         # semillas de casos, documentos y destinatario (como A en E4: +1 y +2)
    A:  {casos: 20261008, documentos: 20261009, destinatario: 20261010}   # el flujo de E4, con las reglas de E5
    B:  {casos: 20261108, documentos: 20261109, destinatario: 20261110}   # recibe colaboración de A al nacer
    B0: {casos: 20261108, documentos: 20261109, destinatario: 20261110}   # control: los mismos casos, sin compartir
    BC: {casos: 20261108, documentos: 20261109, destinatario: 20261110}   # los mismos casos; coopera con C en Novice
    C:  {casos: 20261208, documentos: 20261209, destinatario: 20261210}   # par de la cooperación, en paralelo con BC
    N:  {casos: 20261108, documentos: 20261109, destinatario: 20261110}   # SAR neutro de L-3: solo el operador BIO
  compartir_e5:
    roles: [parser, matcher, explainer]   # el Bias Auditor no comparte: sin estados, los axiomas de §4.3.1 no aplican
    gate: evidencia_de_sesgo     # Ω sobre TODAS las decisiones del donante (resultado favorable del rol, como en E4)
    a9: decisiones               # pre-registro corto de E3: ≥ 20 decisiones propias y los dos grupos
    a9_min_decisiones: 20
    a9_ambos_grupos: true
    colaboracion: al_nacer_B     # A → B rol por rol, antes del primer caso de B (B en Born)
    estado_minimo_donante: novice   # axioma [b]: estrictamente superior a Born
    si_falta_un_estado: detener_y_avisar
    cooperacion: ventana_a_ventana   # BC y C procesan sus ventanas en paralelo; al cierre de cada ventana se
                                     # intenta, rol por rol, mientras el rol de BC esté en Novice y no haya
                                     # cooperado; procede si el rol de C también está en Novice (axioma [a])
    tn_por_cooperacion: false    # %TN ≤ %RTN se exige solo si el rol recibió colaboración (Fig. 4.28, p. 123)
  l3:                            # cálculo literal entre configuraciones (Anexo L-3, Tablas L-16 y L-17, pp. 267–270)
    configuraciones: [N, B0, B, BC]   # el promedio es el de estas cuatro; el mínimo de ciclos exitosos, el neutro
    evaluada: B                  # la configuración con colaboración (también se informa BC)
    roles: [parser, matcher, explainer]
  muestreo_e4:                   # pedido de E4_RESPUESTA sobre el resultado 5 de E4 (no cambia la semilla)
    semillas_extra: 200          # semillas 20261008 + 1000·k, k = 1..200, para la distribución de la diferencia
    permutaciones: 10000
    semilla_permutaciones: 20261008

# Pre-registro E6 (08/10/2026): métricas de equidad por rol (punto 5). Se commitea ANTES de correr P5,
# junto con docs/parada_tecnica/E5_RESPUESTA_ClaudeChat_2026-10-08.md. Vale todo lo de equipo_e5 salvo lo
# que se agrega acá. Ningún parámetro del ciclo de vida cambia.
equipo_e6:
  base: equipo_e5
  # Duración de la corrida (E5_RESPUESTA §4): 600 casos por configuración, como en L-3 (10 corridas de 600
  # ciclos, pp. 267–270), para que algunas teorías lleguen a m_min = 5 usos por grupo. Las capas y el
  # intervalo no cambian: los casos de más llegan con el rol en su capa final (sin región 7, como en E4).
  flujo_casos: {BIO: 60, TBO: 100, WIO: 440}
  equipo_equidad:                  # corrida 1: el equipo de E5, sin sesgo programado
    semillas: {casos: 20261008, documentos: 20261009, destinatario: 20261010}   # el flujo de A extendido
    alphas: [1.0, 0.5]             # U_rol = α·u + (1 − α)·ê(t), lado a lado (DE-5); m_min = utilidad.m_min_por_grupo
  sesgo_programado:                # corrida 2: «parámetros programados» (regla 11 de entorno.py)
    rasgo: titulo_local            # proxy declarado en la Si del Matcher; la verdad no depende de él
    semilla_rasgo: 20261011
    semilla_casos: 20261008        # el mismo flujo de 600 casos
    operador_bio: dos_o_mas_skills_clave_y_titulo_local
    magnitudes:                    # brecha de paridad del operador = P(≥ 2 skills) · (p(AR) − p(no-AR))
      detectable: {AR: 0.9, no-AR: 0.1}    # 0,4: detectable con la evidencia acumulada (característica operativa)
      bajo_umbral: {AR: 0.6, no-AR: 0.4}   # 0,1: por debajo del umbral aun con toda la corrida
    configuraciones: [neutro, alpha_1, alpha_0_5]   # el Matcher solo (como en P1): neutro = solo el operador sesgado
    auditor:
      ventana: 20                  # (i) la regla certificada sobre cada ventana de 20 decisiones
      acumulada:                   # (ii) la misma regla sobre lo acumulado desde que el Matcher entró en su capa
        L: 30                      # Bonferroni δ/L con L = las 30 ventanas de la corrida (conservador)
        delta: 0.05
    comparticion:                  # (iii) colaboración del Matcher sesgado a un Matcher Born nuevo
      a9: decisiones
