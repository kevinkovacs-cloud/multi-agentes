# Bloque E · «parada técnica» — parámetros PRE-REGISTRADOS, versión 2 (08/10/2026).
# Se commitea ANTES de correr P1 v2, P2b v2 y E3. Es la única revisión (E2_RESPUESTA de Claude chat):
# si la v2 tampoco muestra transiciones, no se cambia nada más.
# La versión 1 (la del primer pre-registro, commit 2d847ad) queda congelada en configs/parada_tecnica_v1.yaml.
#
# Cambios respecto de v1 y su motivo (docs/parada_tecnica/E2_RESPUESTA_ClaudeChat_2026-10-08.md):
#   1. omega.gate_evolucion: «puntual» → «evidencia_de_sesgo». Ω niega la promoción solo si
#      LCB_{δ/L}(|Δ_DP|) > τ_b sobre TODAS las decisiones del agente en la capa (L = cierres posibles de
#      la capa, Bonferroni). Motivo: con ventanas de 20, el gate puntual era ruido de muestreo; se usa el
#      mismo primitivo que la regla de bloqueo publicada (cota de confianza, no estimación puntual).
#   2. planificador.utilidad_teoria: «u_tarea» → «accion». U(Si, A) = (aciertos de A en la celda + 1) /
#      (K(Si, A) + 2), igual para todas las variantes (Si, A, ·); validez del plan: U ≥ 0,5. Motivo:
#      utilidad basada en la acción (Ierache 2010, §4.4.3.2, pp. 89–90; el planificador por ranking rinde
#      mejor con ella, p. 107) y recomendación 2(a) de la hoja; evita que un acierto aislado deje U = 1.
#   3. ciclo_de_vida.evaluacion: «por_intervalo» → «acumulada_en_la_capa». CE_a, CE_0 y teorías nuevas se
#      acumulan desde el inicio de la capa (p. 118: ciclos exitosos es un contador acumulado; Fig. 4.28).
#   4. compartir (nuevo, para E3): mismo criterio que el gate v2 y can_donate.
# Sin cambios: semilla, n, ciclos por capa, %RCE, %RTN, umbral de ciclo exitoso, ε de WIO, τ_b, δ.

version_preregistro: v2
semilla: 20261008                 # aprobado (E2_RESPUESTA §5)

ciclo_de_vida:
  n_intervalo: 20                 # P1: ciclos por intervalo; también la ventana de fair(W) informada
  ciclos_por_capa:
    BIO: 60                       # 3 cierres posibles (L = 3)
    TBO: 100                      # 5 cierres posibles (L = 5)
    WIO: 100                      # 5 cierres posibles (L = 5)
  rce: 25                         # P1: %RCE
  rtn: 20                         # P1: %RTN (solo si el agente recibió colaboración en la capa)
  umbral_ciclo_exitoso: 0.75      # p. 118. Ciclo exitoso = la acción del ciclo fue correcta (u del ciclo = 1), igual para el agente y el SAR neutro (E2_RESPUESTA §2)
  evaluacion: acumulada_en_la_capa   # v2, cambio 3
  fin_en_mature: true             # aprobado (E2_RESPUESTA §5)
  sin_promocion: detener          # P2

omega:
  gate_evolucion: evidencia_de_sesgo   # v2, cambio 1; la reputación r y el certificado se informan, no deciden
  tau_b: 0.075                    # umbral del Monitor (el mismo de la regla de bloqueo)
  delta: 0.05                     # nivel de la cota; Bonferroni δ/L por los cierres de la capa
  tau: 0.8                        # se sigue informando la reputación puntual frente a τ (no decide en v2)
  certificado_informado: true
  criterio: demographic_parity    # aprobado (E2_RESPUESTA §5)
  atributo: origin_group          # plano de auditoría (DE-4)

planificador:
  orden: fig_4_21                 # U desc, P desc, K asc (desempate: recencia desc, id asc)
  utilidad_teoria: accion         # v2, cambio 2: U(Si, A) con Laplace; rango [0, 1] (Ierache usa [−1, 1])
  validez_plan: u_mayor_o_igual_0_5   # v2, cambio 2 (reemplaza a u_tarea > 0)
  acciones_orden_fijo: [ADVANCE, REJECT]   # aprobado: exploración «azar» solo en BIO y TBO
  respaldo_similitud: false       # aprobado: apagado en P1; encendido solo en P2b (ii)
  delta_similitud: 0.7
  similitud: token-cosine

utilidad:
  alpha: 1.0
  alpha_comparacion: 0.5
  m_min_por_grupo: 5              # aprobado; a esta escala α = 0,5 no tiene efecto (se reporta)

entorno:
  ruido_wio_epsilon: 0.1          # aprobado

compartir:                        # E3 (punto 2a), pre-registrado en v2 antes de correr
  gate: evidencia_de_sesgo        # se rechaza al donante si LCB_δ(|Δ_DP|) > τ_b sobre TODAS sus decisiones (una evaluación por operación: sin Bonferroni)
  m0_historia_minima: 3           # A9 en ventanas (corrida original de E3; se conserva para el código heredado)
  # Pre-registro corto de E3 (08/10/2026, E3_RESPUESTA de Claude chat), commiteado antes de correr: A9 se mide
  # en DECISIONES. Motivo: con el gate v2 (LCB) la cantidad de decisiones ya entra en la cota; a A9 solo le
  # queda garantizar que haya decisiones de los dos grupos sobre las cuales calcularla. En el LLC se coopera
  # entre SARs recién nacidos (Ierache 2010, p. 124). Nada más cambia.
  a9: decisiones                  # «ventanas» (original) | «decisiones» (pre-registro corto de E3)
  a9_min_decisiones: 20           # al menos un intervalo de decisiones propias
  a9_ambos_grupos: true           # cada grupo del atributo protegido representado (sin los dos no hay LCB)
  equipos:                        # un Matcher por equipo; cada uno recorre su propio escenario con su semilla
    A: 20261008                   # el agente de P1 v2 (donante de la colaboración si gana Trained o Mature)
    B: 20261108                   # recorre BIO con su semilla hasta ganar Novice (receptor; par de la cooperación)
    C: 20261208                   # ídem (par de la cooperación con B)
  si_falta_un_estado: detener_y_avisar   # E2_RESPUESTA §4: sin fijar estados a mano
