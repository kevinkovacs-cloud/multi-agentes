name: tests

on:
  push:
    branches: ["main", "eje1/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Suite de tests
        run: pytest -q
      - name: E0 — gate del instrumento (B5)
        run: python experiments/e0_instrumento.py --config configs/e0.yaml
