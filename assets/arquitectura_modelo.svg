<svg width="100%" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah"  d="M2 1L8 5L2 9"/></marker>
<marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ahc" d="M2 1L8 5L2 9"/></marker>
<style>
/* ── light mode (default) ── */
:root {
  --heading: #0f172a;
  --sub:     #475569;
  --arr:     #64748b;

  --blue-fill:   #e6f1fb; --blue-stroke:   #185fa5;
  --blue-title:  #0c447c; --blue-sub:      #185fa5;

  --amber-fill:  #faeeda; --amber-stroke:  #854f0b;
  --amber-title: #633806; --amber-sub:     #854f0b;

  --purple-fill: #eeedfe; --purple-stroke: #534ab7;
  --purple-title:#3c3489; --purple-sub:    #534ab7;

  --teal-fill:   #e1f5ee; --teal-stroke:   #0f6e56;
  --teal-title:  #085041; --teal-sub:      #0f6e56;

  --coral-fill:  #faece7; --coral-stroke:  #993c1d;
  --coral-title: #712b13; --coral-sub:     #993c1d;

  --gray-fill:   #f1efe8; --gray-stroke:   #5f5e5a;
  --gray-title:  #444441; --gray-sub:      #5f5e5a;
}

/* ── dark mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --heading: #e2e8f0;
    --sub:     #94a3b8;
    --arr:     #64748b;

    --blue-fill:   #0d2a45; --blue-stroke:   #3b82c4;
    --blue-title:  #93c5fd; --blue-sub:      #60a5fa;

    --amber-fill:  #3a1f00; --amber-stroke:  #d97706;
    --amber-title: #fcd34d; --amber-sub:     #f59e0b;

    --purple-fill: #1e1645; --purple-stroke: #7c6fcd;
    --purple-title:#c4b5fd; --purple-sub:    #a78bfa;

    --teal-fill:   #062a1e; --teal-stroke:   #2dd4bf;
    --teal-title:  #5eead4; --teal-sub:      #2dd4bf;

    --coral-fill:  #3a1208; --coral-stroke:  #f87171;
    --coral-title: #fca5a5; --coral-sub:     #f87171;

    --gray-fill:   #1e1e1c; --gray-stroke:   #78716c;
    --gray-title:  #d6d3d1; --gray-sub:      #a8a29e;
  }
}

.th  { font-size: 14px; font-weight: 700; fill: var(--heading); }
.ts  { font-size: 12px; font-weight: 400; fill: var(--sub); }
.tsm { font-size: 11px; font-weight: 400; fill: var(--sub); }
.tsx { font-size: 10px; font-weight: 400; fill: var(--sub); }

.arr      { stroke: var(--arr); stroke-width: 1.5; fill: none; }
.arrblock { stroke: var(--coral-stroke); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
.ah  { fill: none; stroke: var(--arr);          stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ahc { fill: none; stroke: var(--coral-stroke); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.blue   { fill: var(--blue-fill);   stroke: var(--blue-stroke);   }
.amber  { fill: var(--amber-fill);  stroke: var(--amber-stroke);  }
.purple { fill: var(--purple-fill); stroke: var(--purple-stroke); }
.teal   { fill: var(--teal-fill);   stroke: var(--teal-stroke);   }
.coral  { fill: var(--coral-fill);  stroke: var(--coral-stroke);  }
.gray   { fill: var(--gray-fill);   stroke: var(--gray-stroke);   }

.tblue    { fill: var(--blue-title);   } .tbluesub   { fill: var(--blue-sub);    }
.tamber   { fill: var(--amber-title);  } .tambersub  { fill: var(--amber-sub);   }
.tpurple  { fill: var(--purple-title); } .tpurplesub { fill: var(--purple-sub);  }
.tteal    { fill: var(--teal-title);   } .ttealsub   { fill: var(--teal-sub);    }
.tcoral   { fill: var(--coral-title);  } .tcoralsub  { fill: var(--coral-sub);   }
.tgray    { fill: var(--gray-title);   } .tgraysub   { fill: var(--gray-sub);    }
</style>
</defs>

<!-- ── Sección 1 · Pipeline (instancia HR) ── -->
<text class="th" x="40" y="28">Pipeline de decisión — instancia HR (§4.1)</text>
<text class="ts" x="40" y="46">El Bias Auditor instancia el Monitor Ω como agente-compuerta en la cadena; en el modelo genérico Ω es externo (Fig. 2)</text>

<rect class="blue" x="40" y="64" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th tblue" x="98" y="86" text-anchor="middle">Parser</text>
<text class="ts tbluesub" x="98" y="104" text-anchor="middle">Normaliza perfil</text>
<line x1="156" y1="90" x2="180" y2="90" class="arr" marker-end="url(#arrow)"/>

<rect class="blue" x="180" y="64" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th tblue" x="238" y="86" text-anchor="middle">Matcher</text>
<text class="ts tbluesub" x="238" y="104" text-anchor="middle">Matching semántico</text>
<line x1="296" y1="90" x2="320" y2="90" class="arr" marker-end="url(#arrow)"/>

<rect class="amber" x="320" y="64" width="132" height="52" rx="8" stroke-width="1.6"/>
<text class="th tamber" x="386" y="84" text-anchor="middle">Bias Auditor</text>
<text class="tsm tambersub" x="386" y="102" text-anchor="middle">audita sesgo · compuerta</text>

<text class="tsx" x="464" y="82" text-anchor="middle">pasa</text>
<line x1="452" y1="90" x2="476" y2="90" class="arr" marker-end="url(#arrow)"/>

<rect class="blue" x="476" y="64" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th tblue" x="534" y="86" text-anchor="middle">Explainer</text>
<text class="ts tbluesub" x="534" y="104" text-anchor="middle">Explica decisión</text>

<!-- compuerta: bloquea → escala (hacia el Orchestrator) -->
<path d="M386 116 L386 152" class="arrblock" marker-end="url(#arrowc)"/>
<text class="tsm tcoralsub" x="396" y="137" text-anchor="start">bloquea → escala</text>

<!-- Orchestrator: envuelve / coordina el DAG -->
<line x1="98"  y1="116" x2="98"  y2="152" class="arr" opacity="0.35"/>
<line x1="238" y1="116" x2="238" y2="152" class="arr" opacity="0.35"/>
<line x1="534" y1="116" x2="534" y2="152" class="arr" opacity="0.35"/>
<rect class="purple" x="40" y="152" width="552" height="40" rx="8" stroke-width="0.5"/>
<text class="th tpurple" x="316" y="170" text-anchor="middle">Orchestrator</text>
<text class="ts tpurplesub" x="316" y="186" text-anchor="middle">coordina el DAG · registra audit trail · escala a revisión humana</text>

<!-- ── Sección 2 · Ciclo de vida de cada agente ── -->
<text class="th" x="40" y="232">Ciclo de vida de cada agente (ejemplo: Semantic Matcher)</text>
<text class="ts" x="40" y="250">Todo agente evoluciona Born → Mature recorriendo las tres capas de operadores</text>

<rect class="gray" x="40" y="266" width="600" height="150" rx="14" stroke-width="0.5"/>

<rect class="teal" x="60" y="290" width="170" height="106" rx="10" stroke-width="0.5"/>
<text class="th tteal" x="145" y="314" text-anchor="middle">BIO</text>
<text class="ts ttealsub" x="145" y="334" text-anchor="middle">System prompt</text>
<text class="ts ttealsub" x="145" y="352" text-anchor="middle">Guardrails éticos</text>
<text class="ts ttealsub" x="145" y="370" text-anchor="middle">Constraints legales</text>

<rect class="amber" x="250" y="290" width="170" height="106" rx="10" stroke-width="0.5"/>
<text class="th tamber" x="335" y="314" text-anchor="middle">TBO</text>
<text class="ts tambersub" x="335" y="334" text-anchor="middle">Fine-tuning / RLHF</text>
<text class="ts tambersub" x="335" y="352" text-anchor="middle">Corpus auditado</text>
<text class="ts tambersub" x="335" y="370" text-anchor="middle">(reemplaza mutación)</text>

<rect class="coral" x="440" y="290" width="180" height="106" rx="10" stroke-width="0.5"/>
<text class="th tcoral" x="530" y="314" text-anchor="middle">WIO</text>
<text class="ts tcoralsub" x="530" y="334" text-anchor="middle">Feedback en producción</text>
<text class="ts tcoralsub" x="530" y="352" text-anchor="middle">Transferencia entre</text>
<text class="ts tcoralsub" x="530" y="370" text-anchor="middle">agentes del mismo rol</text>

<line x1="230" y1="343" x2="250" y2="343" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="343" x2="440" y2="343" class="arr" marker-end="url(#arrow)"/>

<!-- ── Sección 3 · Transferencia de teorías (Def. 8) ── -->
<text class="th" x="40" y="452">Transferencia de teorías (colaboración maestro → aprendiz, Def. 8)</text>
<text class="ts" x="40" y="470">Entre instancias sucesivas del mismo rol: un Matcher Mature transfiere su base a un Matcher Novato</text>

<rect class="blue" x="40" y="486" width="180" height="56" rx="10" stroke-width="0.5"/>
<text class="th tblue" x="130" y="508" text-anchor="middle">Matcher Mature</text>
<text class="ts tbluesub" x="130" y="526" text-anchor="middle">base de teorías consolidada</text>

<text class="tsm" x="330" y="506" text-anchor="middle">colabora</text>
<line x1="220" y1="514" x2="440" y2="514" class="arr" marker-end="url(#arrow)"/>

<rect class="gray" x="440" y="486" width="180" height="56" rx="10" stroke-width="0.5"/>
<text class="th tgray" x="530" y="508" text-anchor="middle">Matcher Novato</text>
<text class="ts tgraysub" x="530" y="526" text-anchor="middle">hereda y acelera maduración</text>

<text class="tsm" x="330" y="562" text-anchor="middle">igual → refuerza P, K    ·    similar → suma K (debilita)    ·    nueva → transfiere íntegra</text>
<text class="ts" x="40" y="590">Ω pondera la transferencia: la acepta solo si la reputación de equidad del emisor rⱼ ≥ τ (Def. 9).</text>

<!-- ── Pie ── -->
<text class="ts" x="40" y="618">Teoría ⟨Si, A, Sf, P, K, U⟩: situación inicial, acción, situación final, éxitos (P), usos (K), utilidad (U).</text>
<text class="ts" x="40" y="636">Selección de teoría por mayor U; ante empate, mayor P; luego menor K.</text>
</svg>
