<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></marker>
<style>
/* ── light mode (default) ── */
:root {
  --bg:      transparent;
  --heading: #0f172a;
  --sub:     #475569;
  --arr:     #64748b;

  --blue-fill:   #e6f1fb; --blue-stroke:   #185fa5;
  --blue-title:  #0c447c; --blue-sub:      #185fa5;

  --amber-fill:  #faeeda; --amber-stroke:  #854f0b;
  --amber-title: #633806; --amber-sub:     #854f0b;

  --purple-fill: #eeedfe; --purple-stroke: #534ab7;
  --purple-title:#3c3489; --purple-sub:    #534ab7;

  --teal-fill:   #e1f5ee; --teal-stroke:   #0f6e56;
  --teal-title:  #085041; --teal-sub:      #0f6e56;

  --coral-fill:  #faece7; --coral-stroke:  #993c1d;
  --coral-title: #712b13; --coral-sub:     #993c1d;

  --gray-fill:   #f1efe8; --gray-stroke:   #5f5e5a;
  --gray-title:  #444441; --gray-sub:      #5f5e5a;
}

/* ── dark mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --heading: #e2e8f0;
    --sub:     #94a3b8;
    --arr:     #64748b;

    --blue-fill:   #0d2a45; --blue-stroke:   #3b82c4;
    --blue-title:  #93c5fd; --blue-sub:      #60a5fa;

    --amber-fill:  #3a1f00; --amber-stroke:  #d97706;
    --amber-title: #fcd34d; --amber-sub:     #f59e0b;

    --purple-fill: #1e1645; --purple-stroke: #7c6fcd;
    --purple-title:#c4b5fd; --purple-sub:    #a78bfa;

    --teal-fill:   #062a1e; --teal-stroke:   #2dd4bf;
    --teal-title:  #5eead4; --teal-sub:      #2dd4bf;

    --coral-fill:  #3a1208; --coral-stroke:  #f87171;
    --coral-title: #fca5a5; --coral-sub:     #f87171;

    --gray-fill:   #1e1e1c; --gray-stroke:   #78716c;
    --gray-title:  #d6d3d1; --gray-sub:      #a8a29e;
  }
}

.th  { font-size: 14px; font-weight: 700; fill: var(--heading); }
.ts  { font-size: 12px; font-weight: 400; fill: var(--sub); }
.arr { stroke: var(--arr); stroke-width: 1.5; fill: none; }

.blue   { fill: var(--blue-fill);   stroke: var(--blue-stroke);   }
.amber  { fill: var(--amber-fill);  stroke: var(--amber-stroke);  }
.purple { fill: var(--purple-fill); stroke: var(--purple-stroke); }
.teal   { fill: var(--teal-fill);   stroke: var(--teal-stroke);   }
.coral  { fill: var(--coral-fill);  stroke: var(--coral-stroke);  }
.gray   { fill: var(--gray-fill);   stroke: var(--gray-stroke);   }

.tblue    { fill: var(--blue-title);   } .tbluesub   { fill: var(--blue-sub);    }
.tamber   { fill: var(--amber-title);  } .tambersub  { fill: var(--amber-sub);   }
.tpurple  { fill: var(--purple-title); } .tpurplesub { fill: var(--purple-sub);  }
.tteal    { fill: var(--teal-title);   } .ttealsub   { fill: var(--teal-sub);    }
.tcoral   { fill: var(--coral-title);  } .tcoralsub  { fill: var(--coral-sub);   }
.tgray    { fill: var(--gray-title);   } .tgraysub   { fill: var(--gray-sub);    }
</style>
</defs>

<text class="th" x="40" y="30">Pipeline de decisión (orquestación)</text>
<text class="ts" x="40" y="48">Cada agente recorre su propio ciclo de vida y registra teorías ⟨Si, A, Sf, P, K, U⟩</text>

<rect class="blue" x="40" y="64" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th tblue" x="98" y="86" text-anchor="middle">Parser</text>
<text class="ts tbluesub" x="98" y="104" text-anchor="middle">Normaliza perfil</text>
<line x1="156" y1="90" x2="180" y2="90" class="arr" marker-end="url(#arrow)"/>

<rect class="blue" x="180" y="64" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th tblue" x="238" y="86" text-anchor="middle">Matcher</text>
<text class="ts tbluesub" x="238" y="104" text-anchor="middle">Matching semántico</text>
<line x1="296" y1="90" x2="320" y2="90" class="arr" marker-end="url(#arrow)"/>

<rect class="amber" x="320" y="64" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th tamber" x="378" y="86" text-anchor="middle">Bias Auditor</text>
<text class="ts tambersub" x="378" y="104" text-anchor="middle">Audita sesgo</text>
<line x1="436" y1="90" x2="460" y2="90" class="arr" marker-end="url(#arrow)"/>

<rect class="blue" x="460" y="64" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th tblue" x="518" y="86" text-anchor="middle">Explainer</text>
<text class="ts tbluesub" x="518" y="104" text-anchor="middle">Explica decisión</text>

<rect class="purple" x="180" y="140" width="396" height="44" rx="8" stroke-width="0.5"/>
<text class="th tpurple" x="378" y="160" text-anchor="middle">Orchestrator</text>
<text class="ts tpurplesub" x="378" y="176" text-anchor="middle">Coordina el DAG · registra audit trail · escala a humano</text>
<path d="M98 116 L98 162 L180 162" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="40" y="226">Ciclo de vida de cada agente (ejemplo: Bias Auditor)</text>
<text class="ts" x="40" y="244">Todo agente evoluciona Born → Mature recorriendo las tres capas de operadores</text>

<rect class="gray" x="40" y="260" width="600" height="150" rx="14" stroke-width="0.5"/>

<rect class="teal" x="60" y="284" width="170" height="106" rx="10" stroke-width="0.5"/>
<text class="th tteal" x="145" y="308" text-anchor="middle">BIO</text>
<text class="ts ttealsub" x="145" y="328" text-anchor="middle">System prompt</text>
<text class="ts ttealsub" x="145" y="346" text-anchor="middle">Guardrails éticos</text>
<text class="ts ttealsub" x="145" y="364" text-anchor="middle">Constraints legales</text>

<rect class="amber" x="250" y="284" width="170" height="106" rx="10" stroke-width="0.5"/>
<text class="th tamber" x="335" y="308" text-anchor="middle">TBO</text>
<text class="ts tambersub" x="335" y="328" text-anchor="middle">Fine-tuning / RLHF</text>
<text class="ts tambersub" x="335" y="346" text-anchor="middle">Corpus auditado</text>
<text class="ts tambersub" x="335" y="364" text-anchor="middle">(reemplaza mutación)</text>

<rect class="coral" x="440" y="284" width="180" height="106" rx="10" stroke-width="0.5"/>
<text class="th tcoral" x="530" y="308" text-anchor="middle">WIO</text>
<text class="ts tcoralsub" x="530" y="328" text-anchor="middle">Feedback en producción</text>
<text class="ts tcoralsub" x="530" y="346" text-anchor="middle">Transferencia entre</text>
<text class="ts tcoralsub" x="530" y="364" text-anchor="middle">agentes del mismo rol</text>

<line x1="230" y1="337" x2="250" y2="337" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="337" x2="440" y2="337" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="40" y="452">Transferencia de teorías (colaboración maestro → aprendiz)</text>
<text class="ts" x="40" y="470">Un agente Mature transfiere su base de teorías a un agente Novato del mismo rol</text>

<rect class="coral" x="60" y="486" width="200" height="56" rx="10" stroke-width="0.5"/>
<text class="th tcoral" x="160" y="508" text-anchor="middle">Auditor Mature</text>
<text class="ts tcoralsub" x="160" y="526" text-anchor="middle">Base de teorías consolidada</text>

<text class="ts" x="340" y="508" text-anchor="middle">refuerza P, K</text>
<text class="ts" x="340" y="526" text-anchor="middle">pondera utilidad U</text>
<line x1="260" y1="514" x2="420" y2="514" class="arr" marker-end="url(#arrow)"/>

<rect class="gray" x="420" y="486" width="200" height="56" rx="10" stroke-width="0.5"/>
<text class="th tgray" x="520" y="508" text-anchor="middle">Auditor Novato</text>
<text class="ts tgraysub" x="520" y="526" text-anchor="middle">Hereda y acelera maduración</text>

<text class="ts" x="40" y="582">Teoría ⟨Si, A, Sf, P, K, U⟩: situación inicial, acción, situación final, éxitos (P), usos (K), utilidad (U).</text>
<text class="ts" x="40" y="600">Selección de teoría por mayor U; ante empate, mayor P; luego menor K.</text>
</svg>
